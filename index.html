<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Every Notes</title>
    <meta name="description" content="Local-first personal notes" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme Colors — Dark plum default -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2F172C" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B0C1A" />
    <meta name="theme-color" content="#2F172C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Every Notes" />

    <!-- Immediate Theme Detection (Prevents White Flash) -->
    <script>
      (function() {
        try {
          const storedMode = localStorage.getItem('notes_theme_mode');
          const isDark = storedMode === 'dark' || (!storedMode && window.matchMedia('(prefers-color-scheme: dark)').matches) || (storedMode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) || storedMode === 'true-black';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          
          let storedColor = localStorage.getItem('notes_theme_color');
          if (storedMode === 'true-black' && !storedColor) {
            storedColor = 'slate';
          }
          if (storedColor && storedColor !== 'default') {
            document.documentElement.setAttribute('data-theme', storedColor);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Splash screen styles before React bundles load */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #2F172C;
        color: #F8F3F7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      html.dark body {
        background-color: #1B0C1A;
        color: #FDFBFD;
      }
      #splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 24px;
        user-select: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-title {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
        opacity: 0.9;
      }
      .splash-subtitle {
        font-size: 0.8rem;
        opacity: 0.5;
        margin-bottom: 28px;
      }
      .splash-bar {
        width: 100px;
        height: 3px;
        border-radius: 9999px;
        background-color: rgba(124, 95, 196, 0.15);
        overflow: hidden;
        position: relative;
      }
      .splash-bar-inner {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background-color: #7C5FC4;
        border-radius: 9999px;
        animation: splash-indeterminate 1.5s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @keyframes splash-indeterminate {
        0% { left: -40%; width: 30%; }
        50% { left: 40%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root">
      <div id="splash-container">
        <svg class="splash-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#8B6BD4"/>
              <stop offset="100%" stop-color="#6B46C1"/>
            </linearGradient>
            <linearGradient id="splashFold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#e9e2f8"/>
              <stop offset="100%" stop-color="#f9f7ff"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#splashBg)"/>
          <path d="M156 106 H300 L366 172 V390 C366 401 357 410 346 410 H156 C145 410 136 401 136 390 V126 C136 115 145 106 156 106 Z" fill="#ffffff"/>
          <path d="M300 106 V158 C300 166 306 172 314 172 H366 Z" fill="url(#splashFold)"/>
          <rect x="176" y="210" width="150" height="14" rx="7" fill="#93c5fd"/>
          <rect x="176" y="246" width="120" height="14" rx="7" fill="#bfdbfe"/>
          <rect x="176" y="282" width="140" height="14" rx="7" fill="#dbeafe"/>
          <rect x="176" y="318" width="90" height="14" rx="7" fill="#e2e8f0"/>
          <circle cx="156" cy="126" r="14" fill="#f59e0b"/>
          <circle cx="156" cy="126" r="7" fill="#fbbf24"/>
        </svg>
        <div class="splash-title">Notes App</div>
        <div class="splash-subtitle">Local-first personal notes</div>
        <div class="splash-bar">
          <div class="splash-bar-inner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
