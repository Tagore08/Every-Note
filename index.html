<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Notes App</title>
    <meta name="description" content="Local-first personal notes" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Theme Colors -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />

    <!-- Immediate Theme Detection (Prevents White Flash) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('notes_theme_mode');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Splash screen styles before React bundles load */
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      html.dark body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      #splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 24px;
        user-select: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .splash-title {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
        opacity: 0.9;
      }
      .splash-subtitle {
        font-size: 0.875rem;
        opacity: 0.6;
        margin-bottom: 24px;
      }
      .splash-bar {
        width: 120px;
        height: 3px;
        border-radius: 9999px;
        background-color: rgba(59, 130, 246, 0.2);
        overflow: hidden;
        position: relative;
      }
      .splash-bar-inner {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background-color: #3b82f6;
        border-radius: 9999px;
        animation: splash-indeterminate 1.5s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.04); opacity: 0.92; }
      }
      @keyframes splash-indeterminate {
        0% { left: -40%; width: 30%; }
        50% { left: 40%; width: 50%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 min-h-screen">
    <div id="root">
      <div id="splash-container">
        <svg class="splash-logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e40af"/>
              <stop offset="100%" stop-color="#2563eb"/>
            </linearGradient>
            <linearGradient id="splashFold" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#cbd5e1"/>
              <stop offset="100%" stop-color="#f8fafc"/>
            </linearGradient>
          </defs>
          <rect width="512" height="512" rx="116" fill="url(#splashBg)"/>
          <path d="M156 106 H300 L366 172 V390 C366 401 357 410 346 410 H156 C145 410 136 401 136 390 V126 C136 115 145 106 156 106 Z" fill="#ffffff"/>
          <path d="M300 106 V158 C300 166 306 172 314 172 H366 Z" fill="url(#splashFold)"/>
          <rect x="176" y="210" width="150" height="14" rx="7" fill="#93c5fd"/>
          <rect x="176" y="246" width="120" height="14" rx="7" fill="#bfdbfe"/>
          <rect x="176" y="282" width="140" height="14" rx="7" fill="#dbeafe"/>
          <rect x="176" y="318" width="90" height="14" rx="7" fill="#e2e8f0"/>
          <circle cx="156" cy="126" r="14" fill="#f59e0b"/>
          <circle cx="156" cy="126" r="7" fill="#fbbf24"/>
        </svg>
        <div class="splash-title">Notes App</div>
        <div class="splash-subtitle">Local-first personal notes</div>
        <div class="splash-bar">
          <div class="splash-bar-inner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
